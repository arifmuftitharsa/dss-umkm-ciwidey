services:
  upstock:
    build:
      context: ./app
    image: upstock:latest
    container_name: upstock
    restart: unless-stopped
    volumes:
      - upstock_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upstock.rule=Host(`upstock.wisataalamendah.com`)"
      - "traefik.http.routers.upstock.entrypoints=websecure"
      - "traefik.http.routers.upstock.tls.certresolver=letsencrypt"
      - "traefik.http.services.upstock.loadbalancer.server.port=8501"
    # TIDAK ada "ports:" -- container tidak bind 80/443 langsung, Traefik
    # menjangkau lewat Docker socket (provider docker, exposedByDefault=false,
    # network_mode: host di sisi Traefik) -- tak perlu network kustom di sini,
    # cukup network default (bridge), dikonfirmasi dari inspeksi server langsung.

volumes:
  upstock_data:
    name: upstock_data
